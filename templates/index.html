<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Care - AI Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 640px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== হেডার (লোগো + নাম) ===== */
  .chat-header {
    background: #4f46e5;
    color: #fff;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chat-header img.logo {
    height: 36px;      /* এখানে সংখ্যা বাড়ালে/কমালে লোগো বড়/ছোট হবে */
    width: 36px;
    max-width: 36px;
    max-height: 36px;
    border-radius: 8px;
    object-fit: cover;
    background: #fff;
    flex-shrink: 0;
    display: block;
  }
  .chat-header .title-block {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    overflow: hidden;
  }
  .chat-header .title-block .brand {
    font-size: 16.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .chat-header .title-block .subtitle {
    font-size: 11.5px;
    font-weight: 400;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .chat-header span.dot {
    width: 8px; height: 8px; background: #4ade80; border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  /* ===== হেডার শেষ ===== */

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background: #f4f5f7;
  }
  .msg {
    max-width: 82%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .bot {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
    margin-right: auto;
  }
  .user {
    background: #4f46e5;
    color: #fff;
    border-bottom-right-radius: 4px;
    margin-left: auto;
  }
  .chat-input {
    display: flex;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 24px;
    outline: none;
    font-size: 14.5px;
  }
  .chat-input input:focus { border-color: #4f46e5; }
  .chat-input button {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 0 22px;
    font-size: 14.5px;
    cursor: pointer;
  }
  .chat-input button:hover { background: #4338ca; }
  .typing { font-size: 13px; color: #888; padding: 4px 16px; }
  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 4px 0 12px 0;
    max-width: 90%;
  }
  .suggestion-btn {
    background: #fff;
    border: 1px solid #4f46e5;
    color: #4f46e5;
    border-radius: 14px;
    padding: 9px 14px;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    line-height: 1.4;
  }
  .suggestion-btn:hover {
    background: #4f46e5;
    color: #fff;
  }
  .suggestion-btn.suggestion-used {
    background: #f4f5f7;
    border-color: #d1d5db;
    color: #9ca3af;
    cursor: default;
  }
  .suggestion-btn.suggestion-used:hover {
    background: #f4f5f7;
    color: #9ca3af;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <img class="logo" src="https://raw.githubusercontent.com/mdfakrulislam1990-cmyk/dpl_product-chatbot-Public/main/templates/delta_care.png" alt="Delta Care Logo" onerror="this.style.display='none';">
    <div class="title-block">
      <span class="brand">Delta Care</span>
      <span class="subtitle"><span class="dot"></span> প্রোডাক্ট সহায়ক Agent</span>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg bot">👋 আসসালামু আলাইকুম! আমি Delta Care Agent, আমি আপনাকে প্রোডাক্টের দাম, স্টক ও বিস্তারিত জানাতে সাহায্য করতে পারি। কোন প্রোডাক্ট সম্পর্কে জানতে চান?</div>
    <div class="suggestions" id="suggestions">
      <button class="suggestion-btn" id="sugg1" onclick="sendSuggestion('রিউমাটয়েড আর্থ্রাইটিস কি?', 'sugg1')">১। রিউমাটয়েড আর্থ্রাইটিস কি?</button>
      <button class="suggestion-btn" id="sugg2" onclick="sendSuggestion('রিউমাটয়েড আর্থ্রাইটিস হওয়ার কারনগুলো কি কি?', 'sugg2')">২। রিউমাটয়েড আর্থ্রাইটিস হওয়ার কারনগুলো কি কি?</button>
      <button class="suggestion-btn" id="sugg3" onclick="sendSuggestion('রিউমাটয়েড আর্থ্রাইটিস এর লক্ষণ ও উপসর্গ গুলো কি কি?', 'sugg3')">৩। রিউমাটয়েড আর্থ্রাইটিস এর লক্ষণ ও উপসর্গ গুলো কি কি?</button>
      <button class="suggestion-btn" id="sugg4" onclick="sendSuggestion('রিউমাটয়েড আর্থ্রাইটিস এর চিকিৎসা কিভাবে করতে হয়?', 'sugg4')">৪। রিউমাটয়েড আর্থ্রাইটিস এর চিকিৎসা কিভাবে করতে হয়?</button>
      <button class="suggestion-btn" id="sugg5" onclick="sendSuggestion('কিভাবে আমি রিউমাটয়েড আর্থ্রাইটিস নিয়ন্ত্রণ ও জীবনযাত্রার মান উন্নত করতে পারি?', 'sugg5')">৫। কিভাবে আমি রিউমাটয়েড আর্থ্রাইটিস নিয়ন্ত্রণ ও জীবনযাত্রার মান উন্নত করতে পারি?</button>
    </div>
  </div>
  <div class="typing" id="typing" style="display:none;">বট লিখছে...</div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="যেমনঃ Ask Anything Like Pyrenol এর দাম কত?" onkeydown="if(event.key==='Enter') sendMessage();">
    <button onclick="sendMessage()">পাঠান</button>
  </div>
</div>

<script>
let conversationHistory = [];

function sendSuggestion(question, btnId) {
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.disabled = true;
    btn.classList.add("suggestion-used");
  }
  document.getElementById("userInput").value = question;
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  document.getElementById("typing").style.display = "block";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: conversationHistory })
    });
    const data = await res.json();
    document.getElementById("typing").style.display = "none";
    addMessage(data.reply, "bot");

    conversationHistory.push({ role: "user", content: text });
    conversationHistory.push({ role: "assistant", content: data.reply });
    if (conversationHistory.length > 10) {
      conversationHistory = conversationHistory.slice(-10);
    }
  } catch (e) {
    document.getElementById("typing").style.display = "none";
    addMessage("⚠️ সার্ভারের সাথে সংযোগ করতে সমস্যা হয়েছে।", "bot");
  }
}

function addMessage(text, sender) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerHTML = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
