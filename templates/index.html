e<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রোডাক্ট চ্যাটবট</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 640px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #4f46e5;
    color: #fff;
    padding: 18px 20px;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header span.dot {
    width: 10px; height: 10px; background: #4ade80; border-radius: 50%;
  }
  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background: #f4f5f7;
  }
  .msg {
    max-width: 82%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .bot {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
    margin-right: auto;
  }
  .user {
    background: #4f46e5;
    color: #fff;
    border-bottom-right-radius: 4px;
    margin-left: auto;
  }
  .chat-input {
    display: flex;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 24px;
    outline: none;
    font-size: 14.5px;
  }
  .chat-input input:focus { border-color: #4f46e5; }
  .chat-input button {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 0 22px;
    font-size: 14.5px;
    cursor: pointer;
  }
  .chat-input button:hover { background: #4338ca; }
  .typing { font-size: 13px; color: #888; padding: 4px 16px; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header"><span class="dot"></span> Delta Care - প্রোডাক্ট সহায়ক বট </div>
  <div class="chat-messages" id="messages">
    <div class="msg bot">👋 আসসালামু আলাইকুম! আমি Delta Care Agent আমি আপনাকে প্রোডাক্টের দাম, স্টক ও বিস্তারিত জানাতে সাহায্য করতে পারি। কোন প্রোডাক্ট সম্পর্কে জানতে চান?</div>
  </div>
  <div class="typing" id="typing" style="display:none;">বট লিখছে...</div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="যেমনঃ Ask Anything Like Pyrenol এর দাম কত?" onkeydown="if(event.key==='Enter') sendMessage();">
    <button onclick="sendMessage()">পাঠান</button>
  </div>
</div>

<script>
// কথোপকথনের ইতিহাস ব্রাউজারে রাখা হচ্ছে, যেন বট আগের প্রশ্নের প্রসঙ্গ বুঝতে পারে
// (যেমন: "ওটার দাম কত?" জিজ্ঞেস করলে "ওটা" বলতে কোন প্রোডাক্ট বোঝাচ্ছে বুঝবে)
let conversationHistory = [];

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  document.getElementById("typing").style.display = "block";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: conversationHistory })
    });
    const data = await res.json();
    document.getElementById("typing").style.display = "none";
    addMessage(data.reply, "bot");

    // history আপডেট করা হচ্ছে (সর্বোচ্চ শেষ ১০টা মেসেজ রাখা হচ্ছে, খরচ/স্পিড ঠিক রাখতে)
    conversationHistory.push({ role: "user", content: text });
    conversationHistory.push({ role: "assistant", content: data.reply });
    if (conversationHistory.length > 10) {
      conversationHistory = conversationHistory.slice(-10);
    }
  } catch (e) {
    document.getElementById("typing").style.display = "none";
    addMessage("⚠️ সার্ভারের সাথে সংযোগ করতে সমস্যা হয়েছে।", "bot");
  }
}

function addMessage(text, sender) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerHTML = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
